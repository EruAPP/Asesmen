<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akses Sekali</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f5f5f5;
        padding: 10px;
      }
      h2 {
        color: #333;
      }
      iframe {
        width: 100%;
        height: 80vh;
        border: 2px solid #ccc;
        border-radius: 10px;
        margin-top: 20px;
      }
      #tokenForm {
        margin-top: 40px;
      }
      input {
        padding: 10px;
        width: 200px;
        margin: 5px;
      }
      button {
        padding: 10px 20px;
        cursor: pointer;
        background-color: #007bff;
        border: none;
        color: white;
        border-radius: 5px;
      }
      button:hover {
        background-color: #0056b3;
      }
      #message {
        color: red;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h2>Akses Sekali</h2>

    <div id="content" style="display: none">
      <p>Selamat datang!:</p>
      <iframe
        src="https://drive.google.com/file/d/1GopMHi6WpMHejf8d4-YNNdJsGJrtxDjF/preview"
        allow="autoplay"
      ></iframe>
    </div>

    <div id="tokenForm" style="display: none">
      <p>Halaman ini terkunci. Masukkan token untuk membuka kembali:</p>
      <input type="password" id="token" placeholder="Masukkan token" />
      <button onclick="checkToken()">Kirim</button>
      <p id="message"></p>
    </div>

    <script>
      const VALID_TOKEN = "SMA2025"; // Ganti sesuai kebutuhan
      const STORAGE_KEY = "akses_pertamaHSK";

      function showContent() {
        document.getElementById("tokenForm").style.display = "none";
        document.getElementById("content").style.display = "block";
      }

      function showTokenForm() {
        document.getElementById("content").style.display = "none";
        document.getElementById("tokenForm").style.display = "block";
      }

      // Cek apakah sudah pernah dibuka
      const sudahDibuka = localStorage.getItem(STORAGE_KEY);

      if (sudahDibuka) {
        showTokenForm();
      } else {
        showContent();
        localStorage.setItem(STORAGE_KEY, "true");
      }

      // Fungsi untuk verifikasi token
      function checkToken() {
        const input = document.getElementById("token").value.trim();
        if (input === VALID_TOKEN) {
          showContent();
          document.getElementById("message").innerText = "";
        } else {
          document.getElementById("message").innerText =
            "Token salah, coba lagi.";
        }
      }

      // 🔒 Jika pengguna berpindah tab, minimize, atau pindah aplikasi
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          localStorage.setItem(STORAGE_KEY, "true");
          location.reload();
        }
      });

      // 🔒 Jika jendela kehilangan fokus (klik luar / alt+tab)
      window.addEventListener("blur", () => {
        localStorage.setItem(STORAGE_KEY, "true");
        location.reload();
      });
    </script>
  </body>
</html>
